name: Notify Portfolio From Blog

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger portfolio rebuild
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TRIGGER_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/miyabitti256/root-domain-site/dispatches \
            -f event_type='rebuild-site' \
            -f client_payload[source]='blog'
