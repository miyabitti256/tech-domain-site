name: Notify Portfolio From Tech Blog

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger portfolio rebuild
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TRIGGER_TOKEN }}
        run: |
          echo '{"event_type":"rebuild-site","client_payload":{"source":"tech-blog"}}' | \
          gh api \
            --method POST \
            /repos/miyabitti256/root-domain-site/dispatches \
            --input -
